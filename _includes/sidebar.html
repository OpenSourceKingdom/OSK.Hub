{% assign section = site.data.sidenav[page.section] %}

{% if section %}
<style>
  .sidebar {
    width: 240px;
    min-width: 240px;
    background: #f1f3f5;
    border-right: 1px solid #dee2e6;
    padding: 20px 0;
    align-self: stretch;
  }
  .sidebar-header {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #868e96;
    padding: 0 20px 8px;
  }
  .sidebar-title {
    font-size: 15px;
    font-weight: 600;
    color: #495057;
    padding: 4px 20px 12px;
    border-bottom: 1px solid #dee2e6;
    margin-bottom: 8px;
  }
  .sidebar ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .sidebar li a {
    display: block;
    padding: 8px 20px;
    color: #495057;
    text-decoration: none;
    font-size: 14px;
    border-left: 3px solid transparent;
    transition: background 0.15s, color 0.15s;
  }
  .sidebar li a:hover {
    background: #e9ecef;
    color: #212529;
  }
  .sidebar li.active a {
    background: #e7f1ff;
    color: #2980b9;
    border-left-color: #2980b9;
    font-weight: 500;
  }
</style>

<nav class="sidebar">
  <div class="sidebar-header">Pages</div>
  <div class="sidebar-title">{{ section.title }}</div>
  <ul>
    {% for item in section.pages %}
    <li{% if page.url | replace: site.baseurl, '' == item.url %} class="active"{% endif %}>
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
    </li>
    {% endfor %}
  </ul>
</nav>

{% endif %}
