<style>
   @import url('https://cdn.jsdelivr.net/npm/@fontsource/cascadia-code@5.0.0/files/cascadia-code-latin-400-normal.css');

   body {
     margin: 0;
     font-family: 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace;
     background: #f8f9fa;
     color: #333;
   }
   .header {
     background: #2c3e50;
     display: flex;
     align-items: center;
     padding: 16px 24px;
     gap: 16px;
   }
   .header img {
     height: 36px;
     width: auto;
     cursor: pointer;
   }
   .header span {
     color: #ecf0f1;
     font-size: 18px;
     font-weight: 600;
   }
   main {
     max-width: 900px;
     margin: 40px auto;
     padding: 0 24px;
   }
   h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
   h2 { color: #34495e; margin-top: 32px; }
   table { width: 100%; border-collapse: collapse; margin: 16px 0; }
   th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #dee2e6; }
   th { background: #f1f3f5; color: #495057; font-weight: 600; }
   a { color: #2980b9; }
    footer { text-align: center; padding: 32px; color: #7f8c8d; font-size: 13px; }
    main > p, main > span { width: fit-content; max-width: 100%; }
  </style>

<div class="header">
  <a href="{{ '/' | relative_url }}" class="logo-link"><img src="{{ '/assets/images/logo.png' | relative_url }}" alt="OSK Logo" style="height:36px;width:auto;"></a>
  <span>{{ site.title }}</span>
</div>

{% include nav.html %}

{% assign sectionKey = page.section-id %}{% if sectionKey and site.data.sidenav[sectionKey] %}
<div style="display:flex;min-height:calc(100vh - 120px);width:100%;">
  {% include sidebar.html %}
  <main style="flex:1;min-width:0;max-width:unset !important;margin:0;padding:40px 32px;">
    {{ content }}
  </main>
</div>
{% else %}
<main>
  {{ content }}
</main>
{% endif %}

<footer>
  &copy; {{ "now" | date: "%Y" }} Open Source Kingdom
</footer>
